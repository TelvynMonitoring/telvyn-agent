[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telvyn-python-agent"
version = "0.1.0"
description = "Telvyn OpenTelemetry distribution for Python applications"
requires-python = ">=3.10"
dependencies = ["opentelemetry-distro==0.66b1", "opentelemetry-exporter-otlp-proto-http==1.45.1", "opentelemetry-instrumentation-flask==0.66b1"]

[project.scripts]
telvyn-python = "telvyn_python_agent:main"

[project.entry-points.opentelemetry_distro]
telvyn = "telvyn_python_agent:TelvynDistro"

[project.entry-points.opentelemetry_traces_exporter]
telvyn = "telvyn_python_agent:QuerySafeExporter"

[tool.setuptools]
py-modules = ["telvyn_python_agent"]
