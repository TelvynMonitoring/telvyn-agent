quarkus.http.port=8089
quarkus.http.host=0.0.0.0
quarkus.http.access-log.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:orm;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=orm-import.sql
quarkus.hibernate-orm.log.sql=false
telvyn.security.service=${TELVYN_SERVICE}
telvyn.security.host=telvyn-sdk-timing-default
telvyn.security.environment=${TELVYN_ENV}
telvyn.security.version=${TELVYN_VERSION}
