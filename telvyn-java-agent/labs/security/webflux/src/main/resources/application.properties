server.port=8089
spring.datasource.url=jdbc:h2:mem:flux;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework.jdbc=OFF

spring.r2dbc.url=r2dbc:h2:mem:///fluxr2dbc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
logging.level.org.springframework.r2dbc=OFF
logging.level.io.r2dbc.h2=OFF
