name: telvyn-agent-persistence-lab

services:
  agent:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: lab
    image: telvyn-agent:persistence-lab
    environment:
      TELVYN_INGEST_URL: http://quarkus:8080/api/ingest/v1
      TELVYN_INGEST_TOKEN: ${TELVYN_INGEST_TOKEN:?Defina TELVYN_INGEST_TOKEN com um token kind=agent e capability metrics}
      TELVYN_NODE_NAME: telvyn-persistence-lab
      TELVYN_STATE_DIR: /var/lib/telvyn
      TELVYN_CHECKS_ENABLED: "0"
      TELVYN_OTLP_HTTP_DISABLE: "1"
      COLLECTOR_LOG_LEVEL: debug
    volumes:
      - agent_state:/var/lib/telvyn
    networks:
      - telvyn_backend
    restart: "no"

volumes:
  agent_state:
    name: telvyn-agent-persistence-lab-state

networks:
  telvyn_backend:
    external: true
    name: ${TELVYN_BACKEND_NETWORK:-telvyn-dev_telvyn-net}
